name: Build and validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10,<12'
      - run: python tools/check_source_package.py
      - run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew verifyFull --no-daemon --console=plain 2>&1 | tee build-audit.log
      - run: python tools/check_warning_budget.py build-audit.log
      - uses: actions/upload-artifact@v4
        with:
          name: myriad-ascension-forge-1.20.1
          path: build/libs/*.jar
