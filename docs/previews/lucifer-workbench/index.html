<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>紫曜背轮 · 特效工作台</title><style>
:root{color-scheme:dark;--gold:#d0b68a;--ink:#0c101c;--line:#353140;--text:#e7e0d3}*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--text);font:14px "Microsoft YaHei",system-ui}header{height:76px;padding:14px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:#121521}h1{font:22px Georgia,"Microsoft YaHei";margin:0 0 4px;color:var(--gold)}small{font-size:12px;color:#9898a9}.layout{display:grid;grid-template-columns:minmax(0,1fr) 344px;height:calc(100vh - 76px);overflow:hidden}.stage{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;background:#080812}canvas{width:100%;height:0;min-height:0;flex:1;display:block;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}.hint{position:absolute;left:20px;top:16px;font-size:12px;color:#858397;pointer-events:none}.stats{position:absolute;right:20px;top:16px;color:#bdb2d1;font-size:12px}.playback{flex:none;padding:13px 18px;border-top:1px solid var(--line);background:#11131e;display:flex;gap:9px;align-items:center;flex-wrap:wrap}.playback input[type=range]{flex:1;min-width:90px}aside{overflow:auto;border-left:1px solid var(--line);padding:18px;background:#141622}h2{font-size:14px;color:var(--gold);margin:19px 0 13px;font-weight:500}h2:first-child{margin-top:0}button,select{font:inherit;background:#262537;border:1px solid #66566c;color:#eee2ce;border-radius:5px;padding:8px 11px;cursor:pointer}button:hover,select:hover{border-color:var(--gold);background:#343044}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #d3b16a;outline-offset:3px}button:disabled{opacity:.4;cursor:default}.preset{width:100%}.control{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;margin:12px 0;font-size:12px}.control input[type=range]{grid-column:1/-1;width:100%;margin:0;accent-color:#ae77e0}.control output{color:#b0a0ca;font-variant-numeric:tabular-nums}.control:has(input[type=color]){grid-template-columns:1fr 32px 83px}.control input[type=color]{height:28px;width:32px;padding:0;border:1px solid #5c5068;background:none;cursor:pointer}.hex{width:83px;background:#0c0f19;border:1px solid #3c3449;color:#c6bcdb;font:12px monospace;padding:6px;border-radius:3px}.toggle{margin:9px 0}.toggle input{accent-color:#b282df;width:17px;height:17px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.note{line-height:1.8;font-size:11px;color:#92909f}.message{min-height:38px;color:#c5a7dc;font-size:12px;line-height:1.6;margin-top:12px}.divider{border-top:1px solid var(--line);margin:18px 0}#error{position:absolute;left:20px;right:20px;top:60px;background:#331e29;padding:15px;white-space:pre-wrap;color:#ffacb9}#saved{font-size:11px;color:#8d9f99}#timeline{accent-color:#c894f0}a{color:#cbb2e2}@media(max-width:900px){.layout{grid-template-columns:minmax(0,1fr) 290px}aside{padding:12px}header{padding:14px}}@media(max-width:620px){header{height:auto;min-height:76px}.layout{height:auto;display:block;overflow:visible}.stage{height:62vh}aside{border-left:0;border-top:1px solid var(--line)}.stats{right:12px}.hint{left:12px;font-size:10px}header>small{display:none}}
</style></head><body><header><div><h1>紫曜背轮 · 特效工作台</h1><small>Lucifer Halo / 分层调色与流动雾光 · v3</small></div><small id="engine">初始化渲染…</small></header><div class="layout"><section class="stage" aria-label="实时特效预览"><canvas id="view" aria-label="可拖动侧转和滚轮缩放的法轮预览"></canvas><div class="hint">拖动侧转 · 滚轮缩放<br>法轮为平面预览</div><div class="stats"><span id="fps">— FPS</span> · <span id="time">0.00 s</span></div><div id="error" hidden></div><div class="playback"><button id="pause">暂停</button><button id="replay">重新展开</button><input id="timeline" aria-label="时间轴" type="range" min="0" max="60" step=".01" value="0"><label><input id="loop" type="checkbox"> 循环展开</label></div></section><aside><h2>配色预设</h2><select class="preset" id="preset" aria-label="配色预设"><option value="violet">紫红 · 原参考</option><option value="jade">青金 · 仙途</option><option value="crimson">赤焰 · 黑红</option><option value="ice">冰蓝 · 白电</option><option value="dark">幽紫 · 低亮</option></select><h2>分层颜色</h2><div id="colors"></div><div class="divider"></div><h2>图层开关</h2><div id="layers"></div><div class="divider"></div><h2>形态与动画</h2><div id="motion"></div><div class="divider"></div><h2>参数与截图</h2><div class="grid"><button id="export">导出 JSON</button><button id="import">导入 JSON</button><button id="capture">保存截图</button><button id="reset">恢复默认</button></div><input type="file" id="file" accept=".json,application/json" hidden><p id="saved"></p><div id="message" class="message" role="status"></div><p class="note">颜色选择器支持任意颜色，也可输入 #RRGGBB。参数自动保存在本浏览器；导出文件可用于继续修改与交流。当前为独立视觉工作台，尚未接入游戏。</p></aside></div><script type="x-shader/x-fragment" id="fragmentSource">precision highp float;
uniform vec2 resolution;
uniform float time, intensity, density, tilt;
uniform float radius, rotationSpeed, flowSpeed, mistSpeed, thickness, rayLength, pulseStrength, openingDuration, glowGain;
uniform vec3 ringColor, runeColor, rayColor, mistColor, coreColor, backgroundColor;
uniform vec4 layers;
uniform float mistWidth, mistIntensity, mistTurbulence;
out vec4 fragColor;
#define PI 3.14159265359
float hash(float x){return fract(sin(x*127.1+13.7)*43758.5453);}
float line(float d,float w){return exp(-abs(d)/(w*thickness));}
float ring(float r,float x,float w){return line(r-x,w);}
float seg(vec2 p,vec2 a,vec2 b,float w){vec2 v=b-a;return line(length(p-a-v*clamp(dot(p-a,v)/dot(v,v),0.,1.)),w);}
mat2 rot(float a){return mat2(cos(a),-sin(a),sin(a),cos(a));}
float mistHash(vec3 p){p=fract(p*.1031);p+=dot(p,p.yzx+33.33);return fract((p.x+p.y)*p.z);}
float mistNoise(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
 return mix(mix(mix(mistHash(i),mistHash(i+vec3(1,0,0)),f.x),mix(mistHash(i+vec3(0,1,0)),mistHash(i+vec3(1,1,0)),f.x),f.y),mix(mix(mistHash(i+vec3(0,0,1)),mistHash(i+vec3(1,0,1)),f.x),mix(mistHash(i+vec3(0,1,1)),mistHash(i+vec3(1,1,1)),f.x),f.y),f.z);}
float mistFbm(vec3 p){float sum=0.,weight=.55;for(int i=0;i<4;i++){sum+=weight*mistNoise(p);p=p*2.03+vec3(9.2,3.7,5.1);weight*=.48;}return sum;}
void main(){
 vec2 uv=(gl_FragCoord.xy-.5*resolution)/resolution.y;
 vec3 col=backgroundColor+backgroundColor*.5*max(0.,1.-length(uv));
 float ground=uv.y+.38;col+=vec3(.035,.02,.065)*exp(-abs(ground)*18.);
 float grid=pow(max(0.,cos(uv.x*36.)),45.)*exp(-abs(ground)*8.)*.016;col+=vec3(.3,.18,.5)*grid;
 float t=time;float unfold=smoothstep(0.,openingDuration,t);float pulse=1.-pulseStrength*.5+pulseStrength*.5*sin(t*2.4);
 vec2 q=uv-vec2(0.,.055);q.x/=max(.45,cos(tilt));q=rot(.025*sin(t*.2))*q;
 float scale=radius*max(.03,unfold);q/=scale;
 float r=length(q);float a=atan(q.y,q.x);vec3 violet=vec3(.48,.12,1.), pink=vec3(1.,.13,.52), ice=vec3(.7,.5,1.);
 float glow=0.;float red=0.;
 glow+=ring(r,.79,.007)*1.8+ring(r,.83,.004)+ring(r,.87,.008)*1.4;
 glow+=ring(r,1.,.008)*1.8+ring(r,1.08,.004)+ring(r,1.15,.009)*1.5;
 glow+=ring(r,1.18,.025)*.45+ring(r,1.18,.1)*.10;
 red+=ring(r,.58,.006)*1.8+ring(r,.63,.008)*1.2+ring(r,.69,.007);
 float teeth=pow(max(0.,cos((a+t*.16*rotationSpeed)*80.)),15.);red+=teeth*smoothstep(.68,.69,r)*(1.-smoothstep(.75,.76,r))*1.2;
 float ticks=pow(max(0.,cos((a-t*.08*rotationSpeed)*120.)),22.);glow+=ticks*smoothstep(.95,.96,r)*(1.-smoothstep(1.015,1.025,r));
 // Counter-rotating angular seals, built from thin broken engraved strokes.
 for(int k=0;k<3;k++){
  float kk=float(k);float ang=a+t*rotationSpeed*(mod(kk,2.)<.5?.13:-.17);float cell=floor((ang+PI)*16./(2.*PI));
  float local=fract((ang+PI)*16./(2.*PI));float rr=.54+kk*.09;
  float glyph=line(local-.24,.018)*step(rr-.025,r)*step(r,rr+.025);
  glyph+=line(r-rr,.003)*step(.24,local)*step(local,.69);
  glyph+=line(local-.69,.016)*step(rr-.025,r)*step(r,rr+.008);
  red+=glyph*(.6+.4*hash(cell+kk*17.));
 }
 float rings=glow;glow=0.;
 // Stable indexed radial circuit paths, with stepped lateral offsets and outward pulses.
 float lanes=144.*density;float sector=(a+PI)*lanes/(2.*PI);float id=floor(sector);float local=fract(sector)-.5;
 float rnd=hash(id);float reach=1.18+rayLength*(.17+1.05*hash(id+7.));
 float offset=.15*sin(floor(r*8.+rnd*4.)*2.+id)*smoothstep(1.17,1.4,r);
 float dist=abs(local-offset)*r*2.*PI/lanes;
 float mask=smoothstep(1.13,1.17,r)*(1.-smoothstep(reach-.15,reach,r));
 float travel=pow(max(0.,sin(r*13.-t*4.*flowSpeed+rnd*20.)),12.);
 float thin=line(dist,.0023)*mask;glow+=thin*(.3+travel*1.8);
 glow+=line(dist,.013)*mask*.13;
 float knot=ring(r,reach-.06,.007)*line(dist,.009)*1.2;glow+=knot;
 // Continuous flowing emissive mist: broad soft density, not a polyline or lightning.
 float mist=0.;
 if(abs(r-1.13)<mistWidth*4.+.18 && layers.w>.0){
   float mt=t*mistSpeed;
   vec2 flow=rot(mt*.19)*q;
   vec3 field=vec3(flow*3.4,mt*.22);
   float coarse=mistFbm(field);
   float warp=mistFbm(field*1.28+vec3(3.8,7.1,-mt*.12));
   float center=1.13+(coarse-.5)*.22*mistTurbulence;
   float d=(r-center)/max(.012,mistWidth);
   float veil=exp(-d*d*1.25);
   float detail=mistFbm(vec3(flow*11.+vec2(warp*1.4,coarse),mt*.37));
   float folds=.35+.9*smoothstep(.22,.76,coarse+detail*.25);
   float gauze=pow(max(.0,detail),1.5)*1.4;
   mist=veil*folds*(.35+gauze)*mistIntensity;
   // Diffuse translucent skirt, fading continuously in both radial directions.
   mist+=exp(-d*d*.24)*(.12+.12*coarse)*mistIntensity;
 }

 float inner=exp(-r*r*7.);
 float burst=pow(max(0.,sin(t*1.3)),22.)*.65;
 col+=(ringColor*rings*layers.x+runeColor*red*layers.y+rayColor*glow*layers.z+mistColor*mist*layers.w)*intensity*unfold*pulse*glowGain;
 col+=coreColor*exp(-r*r*4.)*(.055+burst*pulseStrength)*unfold*intensity;

 col+=vec3(.34,.12,.8)*exp(-length(uv-vec2(0.,-.37))*14.)*.15;
 col=1.-exp(-col*1.15);col=pow(col,vec3(.88));fragColor=vec4(col,1.);
}</script><script>
'use strict';
const $=s=>document.querySelector(s);
const defaults={intensity:1,density:1,tilt:0,radius:.19,rotationSpeed:1,flowSpeed:1,mistSpeed:1,mistWidth:.11,mistIntensity:1.2,mistTurbulence:.8,thickness:1,rayLength:1,pulseStrength:.24,openingDuration:2.8,glowGain:1,ringEnabled:true,runeEnabled:true,rayEnabled:true,mistEnabled:true,speed:1,ringColor:'#7b1fff',runeColor:'#ff2185',rayColor:'#7b1fff',mistColor:'#b380ff',coreColor:'#ff2185',backgroundColor:'#080812'};
const ranges={intensity:[0,3,.05],density:[.25,2,.05],tilt:[-1.2,1.2,.01],radius:[.09,.42,.005],rotationSpeed:[-3,3,.05],flowSpeed:[-3,3,.05],mistSpeed:[-3,3,.05],mistWidth:[.025,.3,.005],mistIntensity:[0,3,.05],mistTurbulence:[0,2,.05],thickness:[.3,3,.05],rayLength:[.1,1.8,.05],pulseStrength:[0,1,.01],openingDuration:[.2,8,.1],glowGain:[.1,2,.05],speed:[0,3,.05]};
const labels={intensity:'整体亮度',density:'光脉密度',tilt:'法轮侧转',radius:'法轮大小',rotationSpeed:'符文旋转速度',flowSpeed:'光脉流动速度',mistSpeed:'雾光流动速度',mistWidth:'雾光宽度',mistIntensity:'雾光浓度',mistTurbulence:'雾光卷动强度',thickness:'线条粗细',rayLength:'光脉长度',pulseStrength:'呼吸与脉冲',openingDuration:'展开时长（秒）',glowGain:'发光增益',speed:'总播放速度',ringEnabled:'同心法轮',runeEnabled:'旋转符文',rayEnabled:'径向光脉',mistEnabled:'流动雾光',ringColor:'法轮颜色',runeColor:'符文颜色',rayColor:'光脉颜色',mistColor:'雾光颜色',coreColor:'中心光雾',backgroundColor:'背景颜色'};
const presets={violet:{...defaults},jade:{...defaults,ringColor:'#f4ca71',runeColor:'#4ce6d2',rayColor:'#57bfb7',mistColor:'#d0fff5',coreColor:'#42b29e'},crimson:{...defaults,ringColor:'#fc4739',runeColor:'#ffab32',rayColor:'#c52a5e',mistColor:'#ffe2bd',coreColor:'#cc193c',backgroundColor:'#11070b'},ice:{...defaults,ringColor:'#428dff',runeColor:'#75e5ff',rayColor:'#3186e3',mistColor:'#e2fcff',coreColor:'#4388db'},dark:{...defaults,ringColor:'#793acc',runeColor:'#b32489',rayColor:'#533077',mistColor:'#bc98ec',coreColor:'#671c86',intensity:.65}};
let params={...defaults},time=0,playing=true,loop=false,frameCount=0,saveTimer,last=performance.now(),program,gl;
function validate(data){if(!data||typeof data!=='object'||Array.isArray(data))throw Error('参数必须是对象');data={...data};for(const [oldKey,newKey] of [['arcColor','mistColor'],['arcSpeed','mistSpeed'],['arcEnabled','mistEnabled']]){if(!(newKey in data)&&oldKey in data)data[newKey]=data[oldKey];}const next={...defaults};for(const key of Object.keys(defaults)){if(!(key in data))continue;const v=data[key];if(ranges[key]){if(typeof v!=='number'||!Number.isFinite(v)||v<ranges[key][0]||v>ranges[key][1])throw Error(labels[key]+'超出允许范围');}else if(typeof defaults[key]==='boolean'){if(typeof v!=='boolean')throw Error(labels[key]+'应为开关');}else if(typeof v!=='string'||!/^#[0-9a-f]{6}$/i.test(v))throw Error(labels[key]+'必须为六位 HEX 颜色');next[key]=v;}return next;}
try{const saved=localStorage.getItem('lucifer-halo-workbench-v1');if(saved)params=validate(JSON.parse(saved));}catch(e){$('#message').textContent='未加载旧参数：'+e.message;}
function announce(s){$('#message').textContent=s;}
function persist(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{try{localStorage.setItem('lucifer-halo-workbench-v1',JSON.stringify(params));$('#saved').textContent='已自动保存到本机';}catch(e){$('#saved').textContent='本机存储不可用，请导出 JSON';}},150);}
function sync(){for(const key of Object.keys(defaults)){const e=document.getElementById(key);if(!e)continue;if(e.type==='checkbox')e.checked=params[key];else e.value=params[key];const out=document.getElementById(key+'Value');if(out)out.textContent=typeof params[key]==='number'?Number(params[key]).toFixed(key==='radius'?3:2):params[key];const hex=document.getElementById(key+'Hex');if(hex)hex.value=params[key];}persist();}
function control(key,target){const row=document.createElement('label');row.className='control';const title=document.createElement('span');title.textContent=labels[key];row.append(title);const e=document.createElement('input');e.id=key;if(ranges[key]){const [min,max,step]=ranges[key];Object.assign(e,{type:'range',min,max,step});const out=document.createElement('output');out.id=key+'Value';row.append(out,e);e.oninput=()=>{params[key]=+e.value;out.textContent=(+e.value).toFixed(key==='radius'?3:2);persist();};}else if(typeof defaults[key]==='boolean'){e.type='checkbox';row.classList.add('toggle');row.append(e);e.onchange=()=>{params[key]=e.checked;persist();};}else{e.type='color';const hex=document.createElement('input');hex.type='text';hex.id=key+'Hex';hex.maxLength=7;hex.setAttribute('aria-label',labels[key]+' HEX');hex.className='hex';row.append(e,hex);e.oninput=()=>{params[key]=e.value;hex.value=e.value;persist();};hex.onchange=()=>{if(/^#[0-9a-f]{6}$/i.test(hex.value)){params[key]=hex.value;e.value=hex.value;persist();hex.setCustomValidity('');}else{hex.setCustomValidity('请输入 #RRGGBB');hex.reportValidity();hex.value=params[key];}};}e.setAttribute('aria-label',labels[key]);target.append(row);}
for(const key of ['ringColor','runeColor','rayColor','mistColor','coreColor','backgroundColor'])control(key,$('#colors'));
for(const key of ['ringEnabled','runeEnabled','rayEnabled','mistEnabled'])control(key,$('#layers'));
for(const key of Object.keys(ranges))control(key,$('#motion'));sync();
function apply(next,label){params=validate(next);sync();announce(label);}
$('#preset').onchange=e=>{if(presets[e.target.value])apply(presets[e.target.value],'已应用预设，可继续修改');};
$('#pause').onclick=()=>{playing=!playing;$('#pause').textContent=playing?'暂停':'继续';};
$('#replay').onclick=()=>{time=0;playing=true;$('#pause').textContent='暂停';};
$('#reset').onclick=()=>{apply(defaults,'已恢复紫红默认参数');$('#preset').value='violet';};
$('#loop').onchange=e=>loop=e.target.checked;
$('#timeline').oninput=e=>{time=+e.target.value;playing=false;$('#pause').textContent='继续';};
function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);}
$('#export').onclick=()=>download(new Blob([JSON.stringify({schema:'lucifer-halo/2',parameters:params},null,2)],{type:'application/json'}),'lucifer-halo-recipe.json');
$('#import').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{try{const file=e.target.files[0];if(!file)return;if(file.size>64000)throw Error('参数文件过大');const data=JSON.parse(await file.text());if(!['lucifer-halo/1','lucifer-halo/2'].includes(data.schema))throw Error('不支持的参数版本');const next=validate(data.parameters);apply(next,'参数导入成功');}catch(e){announce('导入失败，保留原参数：'+e.message);}finally{$('#file').value='';}};
$('#capture').onclick=()=>{if(gl&&program)$('#view').toBlob(b=>{if(b)download(b,'lucifer-halo.png');},'image/png');};
const canvas=$('#view');let dragging=false,dragX=0;
canvas.onpointerdown=e=>{if(e.button!==0)return;dragging=true;dragX=e.clientX;canvas.setPointerCapture(e.pointerId);};canvas.onpointerup=()=>dragging=false;canvas.onpointercancel=()=>dragging=false;canvas.onpointermove=e=>{if(!dragging)return;params.tilt=Math.max(-1.2,Math.min(1.2,params.tilt+(e.clientX-dragX)*.004));dragX=e.clientX;sync();};canvas.onwheel=e=>{e.preventDefault();params.radius=Math.max(.09,Math.min(.42,params.radius-e.deltaY*.00015));sync();};
function hex(s){return [1,3,5].map(i=>parseInt(s.slice(i,i+2),16)/255);}
function compile(type,src){const shader=gl.createShader(type);gl.shaderSource(shader,src);gl.compileShader(shader);if(!gl.getShaderParameter(shader,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(shader));return shader;}
function boot(){gl=canvas.getContext('webgl2',{antialias:false,preserveDrawingBuffer:true});if(!gl)throw Error('当前浏览器不支持 WebGL2。请使用 Chrome / Edge 打开。');program=gl.createProgram();gl.attachShader(program,compile(gl.VERTEX_SHADER,'#version 300 es\nin vec2 position;void main(){gl_Position=vec4(position,0,1);}'));gl.attachShader(program,compile(gl.FRAGMENT_SHADER,'#version 300 es\n'+$('#fragmentSource').textContent));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);const at=gl.getAttribLocation(program,'position');gl.enableVertexAttribArray(at);gl.vertexAttribPointer(at,2,gl.FLOAT,false,0,0);
const u={};for(const k of [...Object.keys(defaults),'time','resolution','layers'])u[k]=gl.getUniformLocation(program,k);
let fpsTime=performance.now(),fpsFrames=0;
function frame(now){const dt=Math.min(.06,Math.max(0,(now-last)/1000));last=now;if(playing)time+=dt*params.speed;if(loop&&time>14)time%=14;const d=Math.min(devicePixelRatio,1.5),w=Math.round(canvas.clientWidth*d),h=Math.round(canvas.clientHeight*d);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}gl.viewport(0,0,w,h);gl.uniform2f(u.resolution,w,h);gl.uniform1f(u.time,time);for(const k of Object.keys(defaults)){if(k.endsWith('Color'))gl.uniform3fv(u[k],hex(params[k]));else if(ranges[k])gl.uniform1f(u[k],+params[k]);}gl.uniform4f(u.layers,+params.ringEnabled,+params.runeEnabled,+params.rayEnabled,+params.mistEnabled);gl.drawArrays(gl.TRIANGLES,0,3);frameCount++;fpsFrames++;if(now-fpsTime>600){$('#fps').textContent=Math.round(fpsFrames*1000/(now-fpsTime))+' FPS';fpsTime=now;fpsFrames=0;}$('#time').textContent=time.toFixed(2)+' s';if(document.activeElement!==$('#timeline'))$('#timeline').value=Math.min(60,time);requestAnimationFrame(frame);}requestAnimationFrame(frame);$('#engine').textContent='WebGL2 · 实时渲染';window.workbenchReady=true;
}
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();announce('图形上下文丢失，请刷新；参数已保存在本机。');});
try{boot();}catch(e){$('#engine').textContent='渲染未启动';$('#error').hidden=false;$('#error').textContent=e.message;}
window.haloWorkbench={getParameters:()=>({...params}),applyParameters:p=>apply(p,'参数已更新'),getTime:()=>time,getFrameCount:()=>frameCount,validate};
</script></body></html>
