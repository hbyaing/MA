<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>路西法 · 紫曜背轮预览</title><style>*{box-sizing:border-box}body{margin:0;background:#090914;color:#d9d4ec;font:14px system-ui}header{padding:18px 26px;border-bottom:1px solid #332a4a;display:flex;justify-content:space-between}h1{font-size:19px;margin:0;color:#e2c8ff}small{color:#8d819f}main{position:relative}canvas{display:block;width:100%;height:calc(100vh - 166px);min-height:380px}footer{padding:15px 26px;display:flex;gap:22px;align-items:center;flex-wrap:wrap}button{background:#282039;border:1px solid #765895;color:#ead8ff;padding:8px 18px;border-radius:5px;cursor:pointer}label{display:flex;gap:8px;align-items:center}input{width:110px;accent-color:#b874ff}#error{color:#ffaaa9;position:absolute;top:10px;left:20px}a{color:#c69bff}</style><header><div><h1>紫曜背轮 · Lucifer</h1><small>参考 00:08–00:12 / 紫红法轮 · 径向光脉 · 电弧脉冲</small></div><small>原创程序动画预览 v1 · 尚未接入游戏</small></header><main><canvas id="view"></canvas><div id="error"></div></main><footer><button id="pause">暂停</button><button id="replay">重新展开</button><label>亮度 <input id="power" type="range" min="0.3" max="2" value="1" step=".05"></label><label>光脉密度 <input id="count" type="range" min=".5" max="1.6" value="1" step=".05"></label><label>侧转 <input id="angle" type="range" min="-.95" max=".95" value="0" step=".01"></label><a href="preview.mp4">播放 MP4</a><small id="status"></small></footer><script type="x-shader/x-fragment" id="fragmentSource">precision highp float;
uniform vec2 resolution;
uniform float time, intensity, density, tilt;
out vec4 fragColor;
#define PI 3.14159265359
float hash(float x){return fract(sin(x*127.1+13.7)*43758.5453);}
float line(float d,float w){return exp(-abs(d)/w);}
float ring(float r,float x,float w){return line(r-x,w);}
float seg(vec2 p,vec2 a,vec2 b,float w){vec2 v=b-a;return line(length(p-a-v*clamp(dot(p-a,v)/dot(v,v),0.,1.)),w);}
mat2 rot(float a){return mat2(cos(a),-sin(a),sin(a),cos(a));}
void main(){
 vec2 uv=(gl_FragCoord.xy-.5*resolution)/resolution.y;
 vec3 col=vec3(.009,.009,.025)+vec3(.018,.009,.03)*max(0.,1.-length(uv));
 float ground=uv.y+.38;col+=vec3(.035,.02,.065)*exp(-abs(ground)*18.);
 float grid=pow(max(0.,cos(uv.x*36.)),45.)*exp(-abs(ground)*8.)*.016;col+=vec3(.3,.18,.5)*grid;
 float t=time;float unfold=smoothstep(.15,2.8,t);float pulse=.88+.12*sin(t*2.4);
 vec2 q=uv-vec2(0.,.055);q.x/=max(.45,cos(tilt));q=rot(.025*sin(t*.2))*q;
 float scale=.32*max(.03,unfold);q/=scale;
 float r=length(q);float a=atan(q.y,q.x);vec3 violet=vec3(.48,.12,1.), pink=vec3(1.,.13,.52), ice=vec3(.7,.5,1.);
 float glow=0.;float red=0.;
 glow+=ring(r,.79,.007)*1.8+ring(r,.83,.004)+ring(r,.87,.008)*1.4;
 glow+=ring(r,1.,.008)*1.8+ring(r,1.08,.004)+ring(r,1.15,.009)*1.5;
 glow+=ring(r,1.18,.025)*.45+ring(r,1.18,.1)*.10;
 red+=ring(r,.58,.006)*1.8+ring(r,.63,.008)*1.2+ring(r,.69,.007);
 float teeth=pow(max(0.,cos((a+t*.16)*80.)),15.);red+=teeth*smoothstep(.68,.69,r)*(1.-smoothstep(.75,.76,r))*1.2;
 float ticks=pow(max(0.,cos((a-t*.08)*120.)),22.);glow+=ticks*smoothstep(.95,.96,r)*(1.-smoothstep(1.015,1.025,r));
 // Counter-rotating angular seals, built from thin broken engraved strokes.
 for(int k=0;k<3;k++){
  float kk=float(k);float ang=a+t*(mod(kk,2.)<.5?.13:-.17);float cell=floor((ang+PI)*16./(2.*PI));
  float local=fract((ang+PI)*16./(2.*PI));float rr=.54+kk*.09;
  float glyph=line(local-.24,.018)*step(rr-.025,r)*step(r,rr+.025);
  glyph+=line(r-rr,.003)*step(.24,local)*step(local,.69);
  glyph+=line(local-.69,.016)*step(rr-.025,r)*step(r,rr+.008);
  red+=glyph*(.6+.4*hash(cell+kk*17.));
 }
 // Stable indexed radial circuit paths, with stepped lateral offsets and outward pulses.
 float lanes=144.*density;float sector=(a+PI)*lanes/(2.*PI);float id=floor(sector);float local=fract(sector)-.5;
 float rnd=hash(id);float reach=1.35+1.05*hash(id+7.);
 float offset=.15*sin(floor(r*8.+rnd*4.)*2.+id)*smoothstep(1.17,1.4,r);
 float dist=abs(local-offset)*r*2.*PI/lanes;
 float mask=smoothstep(1.13,1.17,r)*(1.-smoothstep(reach-.15,reach,r));
 float travel=pow(max(0.,sin(r*13.-t*4.+rnd*20.)),12.);
 float thin=line(dist,.0023)*mask;glow+=thin*(.3+travel*1.8);
 glow+=line(dist,.013)*mask*.13;
 float knot=ring(r,reach-.06,.007)*line(dist,.009)*1.2;glow+=knot;
 // Long restrained filament arcs, topology seeded by angle and fixed temporal intervals.
 float frame=floor(t*7.);float lightning=0.;
 for(int i=0;i<5;i++){
  float fi=float(i);float start=hash(fi+frame*3.);float aa=a-start*6.283;
  float arcR=1.12+.045*sin(a*17.+frame)+.025*sin(a*43.+fi);
  float gate=smoothstep(.04,.14,abs(sin(aa*.5)))*(1.-smoothstep(.38,.65,abs(sin(aa*.5))));
  lightning+=ring(r,arcR,.003)*gate*(.3+.7*hash(fi+frame));
 }
 glow+=lightning*1.3;
 float inner=exp(-r*r*7.);red+=inner*(.10+.08*sin(a*6.+r*15.-t*1.7));
 float burst=pow(max(0.,sin(t*1.3)),22.)*.65;
 col+=(violet*glow+pink*red)*intensity*unfold*pulse;
 col+=pink*exp(-r*r*4.)*(.055+burst*.12)*unfold;
 col+=ice*lightning*.6*unfold;
 // Separate suspended humanoid scale reference in front of the halo.
 vec2 h=uv-vec2(0.,-.015);float body=seg(h,vec2(0.,-.09),vec2(0.,.07),.009);
 body=max(body,line(length(h-vec2(0.,.105))-.023,.003));
 body=max(body,seg(h,vec2(-.005,-.08),vec2(-.035,-.22),.006));body=max(body,seg(h,vec2(.005,-.08),vec2(.035,-.22),.006));
 body=max(body,seg(h,vec2(-.005,.055),vec2(-.088,.015),.005));body=max(body,seg(h,vec2(.005,.055),vec2(.088,.015),.005));
 float silhouette=smoothstep(.13,.85,body);col=mix(col,vec3(.018,.012,.04),silhouette*.88);col+=vec3(.8,.46,1.)*body*.40*unfold;
 col+=vec3(.34,.12,.8)*exp(-length(uv-vec2(0.,-.37))*14.)*.15;

async function start(){if(!gl)throw Error('浏览器不支持 WebGL2，请播放 MP4');const fs=document.querySelector('#fragmentSource').textContent;const p=gl.createProgram();gl.attachShader(p,shader(gl.VERTEX_SHADER,'#version 300 es\nin vec2 position;void main(){gl_Position=vec4(position,0,1);}'));gl.attachShader(p,shader(gl.FRAGMENT_SHADER,'#version 300 es\n'+fs));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));gl.useProgram(p);const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);const at=gl.getAttribLocation(p,'position');gl.enableVertexAttribArray(at);gl.vertexAttribPointer(at,2,gl.FLOAT,false,0,0);const loc={};for(const n of ['resolution','time','intensity','density','tilt'])loc[n]=gl.getUniformLocation(p,n);function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(playing)t+=dt;const d=Math.min(devicePixelRatio,1.5),w=Math.round(canvas.clientWidth*d),h=Math.round(canvas.clientHeight*d);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}gl.viewport(0,0,w,h);gl.uniform2f(loc.resolution,w,h);gl.uniform1f(loc.time,t);gl.uniform1f(loc.intensity,+document.querySelector('#power').value);gl.uniform1f(loc.density,+document.querySelector('#count').value);gl.uniform1f(loc.tilt,+document.querySelector('#angle').value);gl.drawArrays(gl.TRIANGLES,0,3);document.querySelector('#status').textContent=t.toFixed(1)+' s · WebGL2';requestAnimationFrame(frame)}requestAnimationFrame(frame);window.previewReady=true;}start().catch(e=>document.querySelector('#error').textContent=e.message);
</script></html>
