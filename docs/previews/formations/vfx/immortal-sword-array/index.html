<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>诛仙剑阵 · 三维特效预览</title><link rel="stylesheet" href="style.css?v=7"></head><body><header><a href="../../index.html" target="_top">仙途 / 特效工作站</a><h1>诛仙剑阵</h1><span>四剑镇域 · 万剑诛仙</span><small>形态预览 · 未接入游戏</small></header><main><section id="stage"><canvas id="view" aria-label="诛仙剑阵三维着色器预览"></canvas><img id="live-frame" hidden alt="本机GPU实时渲染画面"><video id="recorded" muted loop playsinline hidden aria-label="诛仙剑阵实际GPU渲染演示"></video><div class="top"><b>四剑列阵 → 剑群巡天 → 万剑齐落</b><span id="status">正在编译…</span></div><div class="bottom"><span id="phase">持续聚灵</span><span>拖动旋转 · 滚轮缩放</span></div><pre id="error"></pre></section><aside><small>IMMORTAL SWORD ARRAY / 04</small><h2>四剑镇四极，剑意满乾坤。</h2><p>四柄钻石剑尖端插地，分别镇守外围四座副阵。九霄剑诀的三层剑幕反向环绕，独立剑雨持续落入主阵外的环形区域。</p><div class="buttons"><button id="replay">重新起阵</button><button id="pause">暂停</button><button id="impact">演示剑雨</button><button id="curtain-toggle" aria-pressed="true">关闭剑幕</button></div><div id="controls"></div><label>观察角度<select id="camera"><option value="oblique">斜上方 · 看四剑</option><option value="far">远景 · 看全阵</option><option value="top">俯视 · 看阵纹</option><option value="close">近景 · 看剑锋</option></select></label><label>配色<select id="palette"><option value="five">赤金 · 四剑异色</option><option value="jade">玄红 · 杀伐</option><option value="gold">紫金 · 仙威</option></select></label><label>渲染质量<select id="quality"><option value="40">标准 · 40步</option><option value="24">流畅 · 24步</option><option value="64">精细 · 64步</option></select></label><label class="check"><input type="checkbox" id="bloom" checked>阵纹与剑锋辉光</label><div class="buttons"><button id="reset">恢复默认</button><button id="export">导出参数</button><button id="import">导入参数</button><input type="file" id="recipe-file" accept=".json,application/json" hidden><button id="shot">保存画面</button></div><div class="buttons"><button id="reconnect">重连实时渲染</button></div><p class="note">钻石剑贴图、四座外围副阵、三层九霄剑幕与独立循环剑雨。点击演示剑雨重新播放落剑阶段。实时参数只改变预览，不修改游戏。支持浏览器GPU或本机GPU实时渲染。</p></aside></main><footer><span>WEBGL2 · WORLD-SPACE VOLUME</span><label>演出时间 <input id="time" type="range" min="0" max="24" step=".01" value="8"><output id="clock">8.00s</output></label></footer><script type="module" src="app.js?v=8"></script></body></html>
