<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>诛仙剑阵 · 展开动画</title><style>body{margin:0;background:#100c15;color:#e8d5aa;font:16px system-ui}header{padding:16px 24px;display:flex;gap:22px;align-items:center}button{background:#352531;color:#ffe4ac;border:1px solid #846041;padding:9px 18px;cursor:pointer}#stage{color:#d0bcaf}img{display:block;width:100%;height:calc(100vh - 116px);object-fit:contain;touch-action:none}footer{text-align:center;color:#a89999}input{width:250px}</style><header><b>诛仙剑阵 · 展开动画</b><button id="play">暂停</button><button id="restart">重新展开</button><span id="stage"></span><input id="seek" type="range" min="0" max="14" step=".05" value="0"></header><img id="frame"><footer>拖动旋转 · 滚轮缩放 · 双击恢复视角 · 14秒循环演示</footer><script>let t=0,playing=true,last=performance.now(),yaw=.52,pitch=.66,distance=32;const $=s=>document.querySelector(s);$('#play').onclick=()=>{playing=!playing;$('#play').textContent=playing?'暂停':'播放'};$('#restart').onclick=()=>{t=0;playing=true;$('#play').textContent='暂停'};$('#seek').oninput=e=>t=+e.target.value;import('../../../orbit.js').then(({bindOrbit})=>bindOrbit($('#frame'),{read:()=>({yaw,pitch,distance}),write:v=>{yaw=v.yaw;pitch=v.pitch;distance=v.distance;},minDistance:18,maxDistance:60,maxPitch:1.5}));let old;async function tick(){let now=performance.now();if(playing)t=(t+Math.min(.15,(now-last)/1000))%14;last=now;$('#seek').value=t;$('#stage').textContent=t<2?'① 地面法阵展开':t<4?'② 四剑从天而降':t<6?'③ 主阵防护展开':t<9?'④ 分剑蜿蜒上升':'⑤ 高空剑幕成阵';try{let r=await fetch('/gpu/deployment/render',{method:'POST',headers:{'Content-Type':'application/json','X-Workbench':'local'},body:JSON.stringify({time:t,width:1000,height:750,yaw,pitch,distance,reveal:Math.min(1,t/1.7),curtain:1})});if(!r.ok)throw Error(await r.text());let url=URL.createObjectURL(await r.blob());$('#frame').src=url;if(old)URL.revokeObjectURL(old);old=url}catch(e){$('#stage').textContent='连接失败：'+e.message}setTimeout(tick,25)}tick();</script></html>
