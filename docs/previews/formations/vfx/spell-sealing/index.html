<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>禁法结界 · 三维特效预览</title><link rel="stylesheet" href="style.css"></head><body><header><a href="../../index.html" target="_top">仙途 / 特效工作站</a><h1>禁法结界</h1><span>赤渊锁域 · 万法沉寂</span><small>形态预览 · 未接入游戏</small></header><main><section id="stage"><canvas id="view" aria-label="禁法结界三维着色器预览"></canvas><img id="live-frame" hidden alt="本机GPU实时渲染画面"><video id="recorded" muted loop playsinline hidden aria-label="禁法结界实际GPU渲染演示"></video><div class="top"><b>赤纹起阵 → 黑雾封域 → 禁法收束</b><span id="status">正在编译…</span></div><div class="bottom"><span id="phase">持续聚灵</span><span>拖动旋转 · 滚轮缩放</span></div><pre id="error"></pre></section><aside><small>SPELL SEALING / 03</small><h2>赤纹封域，万法归寂。</h2><p>黑曜阵盘升起暗红禁纹，黑雾沿结界游走。赤色锁链环绕封域，周期性禁法脉冲向阵心收束。</p><div class="buttons"><button id="replay">重新起阵</button><button id="pause">暂停</button><button id="impact">触发封禁</button></div><div id="controls"></div><label>观察角度<select id="camera"><option value="oblique">斜上方 · 看封域</option><option value="top">俯视 · 看阵纹</option><option value="close">近景 · 看屏障</option></select></label><label>配色<select id="palette"><option value="five">红黑 · 赤渊封禁</option><option value="jade">深红 · 血纹</option><option value="gold">暗紫 · 冥禁</option></select></label><label>渲染质量<select id="quality"><option value="40">标准 · 40步</option><option value="24">流畅 · 24步</option><option value="64">精细 · 64步</option></select></label><label class="check"><input type="checkbox" id="bloom" checked>禁纹与锁链辉光</label><div class="buttons"><button id="reset">恢复默认</button><button id="export">导出参数</button><button id="import">导入参数</button><input type="file" id="recipe-file" accept=".json,application/json" hidden><button id="shot">保存画面</button></div><div class="buttons"><button id="reconnect">重连实时渲染</button></div><p class="note">黑曜阵盘、暗红穹顶、锁链封环和向心禁法脉冲。可手动触发封禁，也会周期演示。实时参数只改变预览，不修改游戏。支持浏览器GPU或本机GPU实时渲染。</p></aside></main><footer><span>WEBGL2 · WORLD-SPACE VOLUME</span><label>演出时间 <input id="time" type="range" min="0" max="24" step=".01" value="8"><output id="clock">8.00s</output></label></footer><script type="module" src="app.js?v=1"></script></body></html>
