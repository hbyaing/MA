<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>聚灵阵 · 三维特效预览</title><link rel="stylesheet" href="style.css"></head><body><header><a href="../../index.html" target="_top">仙途 / 特效工作站</a><h1>聚灵阵</h1><span>五行归元 · 纳气聚灵</span><small>形态预览 · 未接入游戏</small></header><main><section id="stage"><canvas id="view" aria-label="聚灵阵三维着色器预览"></canvas><img id="live-frame" hidden alt="本机GPU实时渲染画面"><video id="recorded" src="preview.mp4" muted loop playsinline hidden aria-label="聚灵阵实际GPU渲染演示"></video><div class="top"><b>灵气入阵 → 阵脉汇流 → 阵眼升腾</b><span id="status">正在编译…</span></div><div class="bottom"><span id="phase">持续聚灵</span><span>拖动旋转 · 滚轮缩放</span></div><pre id="error"></pre></section><aside><small>SPIRIT GATHERING / 01</small><h2>让灵气，有迹可循。</h2><p>五行阵石引入灵气，流光沿阵脉汇聚，中央灵雾形成缓慢上升的旋涡。</p><div class="buttons"><button id="replay">重新起阵</button><button id="pause">暂停</button></div><div id="controls"></div><label>观察角度<select id="camera"><option value="oblique">斜上方 · 看汇流</option><option value="top">俯视 · 看阵纹</option><option value="close">近景 · 看阵眼</option></select></label><label>配色<select id="palette"><option value="five">五行 · 青玉金纹</option><option value="jade">青玉 · 清灵</option><option value="gold">金色 · 充盈</option></select></label><label>渲染质量<select id="quality"><option value="40">标准 · 40步</option><option value="24">流畅 · 24步</option><option value="64">精细 · 64步</option></select></label><label class="check"><input type="checkbox" id="bloom" checked>阵纹与灵气辉光</label><div class="buttons"><button id="reset">恢复默认</button><button id="export">导出参数</button><button id="import">导入参数</button><input type="file" id="recipe-file" accept=".json,application/json" hidden><button id="shot">保存画面</button></div><div class="buttons"><button id="reconnect">重连实时渲染</button></div><p class="note">地面阵纹、五个实体节点、世界空间体积灵雾与向心粒子。实时参数只改变预览，不修改游戏。支持浏览器GPU或本机GPU实时渲染。</p></aside></main><footer><span>WEBGL2 · WORLD-SPACE VOLUME</span><label>演出时间 <input id="time" type="range" min="0" max="24" step=".01" value="8"><output id="clock">8.00s</output></label></footer><script type="module" src="app.js"></script></body></html>
