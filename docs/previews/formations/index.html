<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>万界仙途 · 阵法工作台</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1218;color:#e9dfca;font:14px "Microsoft YaHei",system-ui}header{height:73px;display:flex;align-items:center;justify-content:space-between;padding:15px 24px;border-bottom:1px solid #5b503b;background:#152124}h1{font-size:22px;color:#e1c78e;margin:0 0 5px}small{color:#92a5a3;font-size:12px}.layout{display:grid;grid-template-columns:224px minmax(0,1fr);height:calc(100vh - 73px)}nav{padding:18px 12px;overflow:auto;border-right:1px solid #5b503b;background:#131f23}input{background:#0b141a;color:#e7decb;border:1px solid #5e614f;width:100%;padding:10px;border-radius:4px;margin-bottom:18px}button{width:100%;text-align:left;cursor:pointer;background:#18272b;color:#d6cbb4;border:1px solid #3c4e4c;border-radius:4px;padding:12px;margin:0 0 9px;font:inherit}button:hover{border-color:#b29d71;background:#293c38}button.active{border-color:#dfc48a;color:#ffe9b6;background:#31433b}button small{display:block;font-size:11px;margin-top:5px;line-height:1.6}h2{font-size:12px;color:#8b9a93;font-weight:normal;margin:10px 0 14px}section{display:flex;flex-direction:column;min-width:0;min-height:0}#bar{height:49px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:9px 18px;background:#111b20;border-bottom:1px solid #313f3f}#title{color:#dfc48a}a{color:#d3c08f;text-decoration:none}a:hover{text-decoration:underline}iframe{width:100%;height:100%;flex:1;min-height:0;border:0;background:#080b12}footer{padding:14px 4px;color:#7e928b;font-size:11px;line-height:1.8}.empty{font-size:12px;color:#8c9f9a}@media(max-width:800px){.layout{grid-template-columns:165px minmax(0,1fr)}header{padding:12px}h1{font-size:19px}header>small{display:none}nav{padding:12px 8px}button{padding:10px 7px;font-size:12px}}</style><header><div><h1>万界仙途 · 阵法工作台</h1><small>全部阵法与御剑预览 / 统一切换 · 独立实时调参</small></div><small>仅预览工具 · 不修改游戏数据</small></header><div class="layout"><nav><input id="search" placeholder="搜索阵法…" aria-label="搜索阵法"><h2>阵法与结界</h2><div id="list"></div><footer>只加载当前选中预览，切换后停止上一页。原有展开动画、调参和配色入口保留。</footer></nav><section><div id="bar"><span id="title"></span><a id="standalone" target="_blank" rel="noopener">独立打开 ↗</a></div><iframe id="preview" title="阵法实时预览" allow="fullscreen" allowfullscreen></iframe></section></div><script>
const entries=[{id:'spirit',name:'聚灵阵',note:'聚气 · 五行阵石',url:'vfx/spirit-gathering/index.html'},{id:'protect',name:'防护阵',note:'半透明穹顶 · 受击波纹',url:'vfx/protective-array/index.html'},{id:'sealing',name:'禁法结界',note:'红黑封域 · 锁链禁纹',url:'vfx/spell-sealing/index.html'},{id:'immortal',name:'诛仙剑阵',note:'四剑副阵 · 主阵护罩 · 剑幕',url:'vfx/immortal-sword-array/index.html'},{id:'deployment',name:'诛仙剑阵 · 展开动画',note:'起阵 → 四剑 → 护罩 → 剑幕',url:'vfx/immortal-sword-array/deployment/index.html'},{id:'jiuxiao',name:'九霄剑诀',note:'剑流 · 高空剑幕',url:'vfx/sword-formations/index.html'},{id:'wanjian',name:'万剑归宗',note:'御剑群 · 收束与齐发',url:'vfx/sword-formations/index.html?skill=wanjian'},{id:'halo',name:'紫曜背轮',note:'符文法轮 · 流动雾光 · 调色',url:'../lucifer-workbench/index.html'}];
let selected;function select(id){const item=entries.find(e=>e.id===id)||entries[0];selected=item.id;document.querySelector('#title').textContent=item.name;document.querySelector('#standalone').href=item.url;document.querySelector('#preview').src=item.url;history.replaceState(null,'','#'+item.id);try{localStorage.setItem('xiantu-formation-gallery',item.id)}catch{}render();}function render(){const q=document.querySelector('#search').value;const list=document.querySelector('#list');list.replaceChildren();for(const e of entries.filter(e=>(e.name+e.note).includes(q))){const b=document.createElement('button');b.dataset.id=e.id;b.className=e.id===selected?'active':'';b.setAttribute('aria-pressed',String(e.id===selected));b.textContent=e.name;const s=document.createElement('small');s.textContent=e.note;b.append(s);b.onclick=()=>select(e.id);list.append(b)}if(!list.children.length){const p=document.createElement('p');p.className='empty';p.textContent='没有匹配的阵法';list.append(p)}}document.querySelector('#search').oninput=render;let saved;try{saved=localStorage.getItem('xiantu-formation-gallery')}catch{}select(location.hash.slice(1)||saved||'spirit');window.formationGallery={entries,select};
</script></html>
