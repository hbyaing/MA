<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>储物袋 UI · 预览工作台</title><style>
*{box-sizing:border-box}body{margin:0;background:#0c1117;color:#e9dfcb;font:14px "Microsoft YaHei",sans-serif}header{padding:18px 26px;background:#151e22;border-bottom:1px solid #665b43;display:flex;justify-content:space-between}h1{margin:0 0 5px;color:#e6c98c;font-size:20px}small{color:#9ba69d;font-size:12px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;height:calc(100vh - 83px)}.stage{overflow:auto;display:flex;align-items:center;justify-content:center;min-height:400px;background:radial-gradient(ellipse at center,#263333,#0b1218)}.stage.paper{background:#d4c8ac}.stage.black{background:#000}#wrap{position:relative;flex:none}#screen{width:300px;height:242px;position:absolute;transform-origin:top left}canvas{width:300px;height:242px;position:absolute;left:0;top:0;image-rendering:pixelated}input,button,select{font:inherit}#search{position:absolute;left:26px;top:26px;width:86px;height:10px;background:transparent;border:0;outline:0;color:#e9dfcb;font:9px "Microsoft YaHei";padding:0}#search::placeholder{color:#9ba69d}#screen button{position:absolute;height:20px;font:9px "Microsoft YaHei";border:1px solid #b39a66;color:#e9dfcb;background:linear-gradient(#253631,#131d20);padding:0 5px;box-shadow:0 0 0 1px #554632}#screen button:hover,#screen button:focus-visible{background:linear-gradient(#344a43,#131d20);border-color:#e6c98c;outline:none}#category{left:122px;top:19px;width:168px}#sort{left:194px;top:158px;width:96px}#magnet{left:194px;top:216px;width:96px;opacity:0;cursor:pointer}aside{padding:23px 20px;border-left:1px solid #665b43;background:#151e22;overflow:auto}h2{font-size:14px;color:#e6c98c;margin:0 0 16px}.ctrl{display:block;margin:20px 0;color:#cbbf9e;font-size:13px}.ctrl input,.ctrl select{display:block;width:100%;margin-top:12px;accent-color:#7ab6a2}aside button,select{background:#24352f;border:1px solid #8c784f;color:#e9dfcb;padding:9px;width:100%;margin-bottom:10px;border-radius:3px;cursor:pointer}aside button:hover{background:#344a43}p{font-size:12px;line-height:1.9;color:#9ba69d}#state{border-top:1px solid #665b43;padding-top:15px;color:#7ab6a2}#tip{min-height:40px}input:focus-visible,select:focus-visible{outline:2px solid #b39a66}#rail{position:absolute;left:176px;top:40px;width:10px;height:108px;cursor:ns-resize}@media(max-width:760px){.layout{display:block;height:auto}.stage{height:65vh}aside{border-left:0}header>small{display:none}}
</style><header><div><h1>储物袋 UI · 墨金青玉</h1><small>按当前重置源码布局制作 / 300 × 242 逻辑像素</small></div><small>网页布局预览 · 非游戏实机截图</small></header><div class="layout"><main class="stage"><div id="wrap"><div id="screen"><canvas id="art" width="1200" height="968"></canvas><input id="search" placeholder="名称或物品ID" aria-label="搜索物品"><button id="category">分类：全部</button><button id="sort">整理同类物品</button><button id="magnet" aria-label="磁铁开关"></button><div id="rail" aria-label="储物区滚动条"></div></div></div></main><aside><h2>预览设置</h2><label class="ctrl">界面缩放 <output id="zoomValue"></output><input id="zoom" type="range" min="1" max="4" step=".1" value="3"></label><label class="ctrl">背景<select id="background"><option value="">深色环境</option><option value="black">纯黑</option><option value="paper">浅色环境</option></select></label><button id="sample">装入示例物品</button><button id="clear">清空预览</button><button id="shot">导出 PNG</button><p id="state">磁铁：关闭</p><p id="tip">悬停格位查看示例物品。可搜索、切换分类，点击磁铁可预览开关。</p><p>此工作台用于查看外观和布局。物品与交互为演示数据，不会修改游戏背包。网页字体与 Minecraft 字体存在差异。</p></aside></div><script>
const $=s=>document.querySelector(s),c=$('#art'),g=c.getContext('2d');g.scale(4,4);g.imageSmoothingEnabled=false;
const C={gold:'#b39a66',bright:'#e6c98c',line:'#665b43',text:'#e9dfcb',muted:'#9ba69d',deep:'#10171b'};let on=false,items=[],category=0,row=0,hover=-1;const labels=['全部','草药','黄阶草药','玄阶草药','地阶草药','天阶草药','仙阶草药','丹药','灵石','方块','装备','其他'];const imgs={};let ready=0;for(const n of ['storage_bag','spirit_stone','adamantine_vine','bigu_pill','artifact_sword_rank_1','toggle_jade_v2']){const im=new Image();im.onload=()=>{ready++;draw()};im.src='assets/'+n+'.png';imgs[n]=im;}
function fill(x,y,w,h,col){g.fillStyle=col;g.fillRect(x,y,w,h)}function frame(x,y,w,h,col){fill(x,y,w,1,col);fill(x,y+h-1,w,1,col);fill(x,y,1,h,col);fill(x+w-1,y,1,h,col)}function text(s,x,y,col=C.text){g.font='9px "Microsoft YaHei"';g.fillStyle=col;g.textBaseline='top';g.fillText(s,x,y)}function slot(x,y){const z=g.createLinearGradient(0,y,0,y+18);z.addColorStop(0,'#0b1216');z.addColorStop(1,'#27312e');fill(x,y,18,18,z);frame(x,y,18,18,'#64614c');fill(x+2,y+2,3,1,'#94855c');fill(x+14,y+15,2,1,'#94855c')}
function corner(x,y,dx,dy){for(let i=0;i<9;i++){fill(x+dx*i,y,1,1,C.bright);fill(x,y+dy*i,1,1,C.bright)}for(let i=0;i<4;i++){fill(x+dx*(i+3),y+dy*3,1,1,C.gold);fill(x+dx*3,y+dy*(i+3),1,1,C.gold)}}function meander(x,y,horizontal){for(const [a,b]of [[0,0],[1,0],[2,0],[2,1],[2,2],[1,2],[0,2],[0,3],[0,4],[1,4],[2,4],[2,5],[2,6],[1,6],[0,6]])fill(x+(horizontal?b:a),y+(horizontal?a:b),1,1,'#8c784f')}
function filtered(){const q=$('#search').value.toLowerCase();return items.filter(i=>(i.name.includes(q)||i.id.includes(q))&&(category===0||i.kind===category||(category>=2&&category<=6&&i.kind===1&&i.tier===category-1)))}
function icon(n,x,y){let im=imgs[n];if(im.complete&&im.naturalWidth)g.drawImage(im,x,y,16,16)}function draw(exporting=false){g.clearRect(0,0,300,242);const bg=g.createLinearGradient(0,0,0,242);bg.addColorStop(0,'#1d292b');bg.addColorStop(1,'#141c20');fill(0,0,300,242,bg);frame(0,0,300,242,C.bright);frame(2,2,296,238,'#6f765a');corner(0,0,1,1);corner(299,0,-1,1);corner(0,241,1,-1);corner(299,241,-1,-1);for(let y=24;y<224;y+=16){meander(1,y,false);meander(296,y,false)}for(let x=20;x<282;x+=16){meander(x,1,true);meander(x,238,true)}fill(12,18,276,1,'#6d644a');text('储物袋',8,6,C.gold);fill(8,19,108,20,C.deep);frame(8,19,108,20,C.gold);g.strokeStyle=C.gold;g.lineWidth=1;g.beginPath();g.arc(16,27,3,0,Math.PI*2);g.moveTo(18,29);g.lineTo(21,32);g.stroke();
const list=filtered(),max=Math.max(0,Math.ceil(list.length/9)-6);row=Math.min(row,max);for(let y=0;y<6;y++)for(let x=0;x<9;x++){slot(7+x*18,39+y*18);let i=list[(row+y)*9+x];if(i){icon(i.id,8+x*18,40+y*18);text(i.count>999?'1K':String(i.count),12+x*18,49+y*18)}}for(let y=0;y<3;y++)for(let x=0;x<3;x++)slot(193+x*18,57+y*18);slot(269,79);for(let y=0;y<3;y++)for(let x=0;x<9;x++)slot(7+x*18,157+y*18);for(let x=0;x<9;x++)slot(7+x*18,215);icon('storage_bag',8,216);text('随身工作台',194,43,C.gold);text('滚轮或拖动查看',194,130,C.gold);text('背包',8,146);text('Shift：快速存取',194,188,C.muted);text('草药保留原年份',194,203,C.muted);fill(176,40,10,108,C.deep);const thumb=Math.max(12,108*6/(max+6)),sy=40+(max?(108-thumb)*row/max:0);fill(177,sy,8,thumb,'#b8a273');fill(194,216,96,20,C.deep);frame(194,216,96,20,hover===99?C.bright:C.line);text(on?'磁铁 开':'磁铁 关',199,222,on?'#7ab6a2':C.text);let im=imgs.toggle_jade_v2;if(im.complete&&im.naturalWidth)g.drawImage(im,710,on?187:460,432,200,258,220,26,12);if(exporting===true){fill(122,19,168,20,'#253631');frame(122,19,168,20,C.gold);text('分类：'+labels[category],190,25);fill(194,158,96,20,'#253631');frame(194,158,96,20,C.gold);text('整理同类物品',215,164);text($('#search').value||'名称或物品ID',26,26,C.muted);}$('#state').textContent='磁铁：'+(on?'开启':'关闭')+' · 显示 '+list.length+' 项';$('#category').textContent='分类：'+labels[category];}
function resize(){const stage=$('.stage'),zoom=Math.min(+$('#zoom').value,(stage.clientWidth-40)/300,(stage.clientHeight-40)/242);$('#screen').style.transform='scale('+zoom+')';$('#wrap').style.width=300*zoom+'px';$('#wrap').style.height=242*zoom+'px';$('#zoomValue').textContent=zoom.toFixed(2)+'×';}
$('#zoom').oninput=resize;window.onresize=resize;$('#background').onchange=e=>$('.stage').className='stage '+e.target.value;$('#search').oninput=()=>{row=0;draw()};$('#category').onclick=()=>{category=(category+1)%labels.length;row=0;draw()};$('#magnet').onclick=()=>{on=!on;draw()};$('#sort').onclick=()=>{items.sort((a,b)=>a.name.localeCompare(b.name,'zh-CN'));draw();$('#tip').textContent='已整理示例物品（仅网页演示）'};
$('#sample').onclick=()=>{const demo=[['spirit_stone','灵石',8],['adamantine_vine','金刚藤',1],['bigu_pill','辟谷丹',7],['artifact_sword_rank_1','法器剑',10]];items=Array.from({length:90},(_,k)=>{const d=demo[k%4];return{id:d[0],name:d[1],kind:d[2],tier:k%5+1,count:k%4===3?1:64}});draw()};$('#clear').onclick=()=>{items=[];draw()};$('#shot').onclick=()=>{draw(true);const a=document.createElement('a');a.download='xiantu-storage-bag.png';a.href=c.toDataURL();a.click();draw()};$('#screen').onwheel=e=>{e.preventDefault();row=Math.max(0,row+Math.sign(e.deltaY)*3);draw()};let railDrag=false;function scrollRail(e){const box=$('#rail').getBoundingClientRect(),list=filtered(),max=Math.max(0,Math.ceil(list.length/9)-6);row=Math.max(0,Math.round((e.clientY-box.top)/box.height*max));draw()}$('#rail').onpointerdown=e=>{railDrag=true;$('#rail').setPointerCapture(e.pointerId);scrollRail(e)};$('#rail').onpointermove=e=>{if(railDrag)scrollRail(e)};$('#rail').onpointerup=()=>railDrag=false;$('#rail').onpointercancel=()=>railDrag=false;$('#screen').onpointermove=e=>{const box=$('#screen').getBoundingClientRect(),x=(e.clientX-box.left)*300/box.width,y=(e.clientY-box.top)*242/box.height;if(x>=8&&x<170&&y>=40&&y<148){let i=filtered()[(row+Math.floor((y-40)/18))*9+Math.floor((x-8)/18)];$('#tip').textContent=i?i.name+' · 示例数量 '+i.count:'空格位';}};resize();draw();window.bagPreviewReady=true;
</script></html>
